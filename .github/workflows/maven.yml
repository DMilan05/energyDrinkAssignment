name: PR workflow

on:
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (Clone repo to this runner)
        uses: actions/checkout@v3

      - name: Install java
        uses: actions/setup-java@
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: mvn build

      - name: Verify
        run: mvn verify